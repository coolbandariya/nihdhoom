<!doctype html>
<html lang="en" data-theme="kisan">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#f7f0e1"/>
  <meta name="description" content="NIRDHOOM — farmer-first crop residue clearance, dispatch, verification and offtake network."/>
  <title>NIRDHOOM — Field Operations Network</title>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Plus+Jakarta+Sans:wght@500..800&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+Devanagari:wght@400..700&family=Noto+Sans+Gurmukhi:wght@400..700&display=swap" rel="stylesheet">
  <style>
    html,body,#root{min-height:100%;margin:0}
    body{min-height:100vh;background:#f7f0e1}
    #root{min-height:100vh}
    .boot-shell{min-height:100vh;display:grid;place-items:center;background:#f7f0e1;color:#2f3a55;font:600 13px 'DM Sans',system-ui,sans-serif}
    .boot-card{display:flex;align-items:center;gap:10px;padding:13px 16px;border:1px solid #e6dbc4;border-radius:14px;background:#fffbf3;box-shadow:0 10px 24px -14px rgba(19,35,26,.22)}
    .boot-dot{width:7px;height:7px;border-radius:999px;background:#0f6e3a;box-shadow:0 0 0 4px #e3f1e6}
  </style>
</head>
<body>
  <div id="root"><div class="boot-shell" aria-label="Loading NIRDHOOM"><div class="boot-card"><span class="boot-dot"></span><span>Loading NIRDHOOM operations…</span></div></div></div>
  <noscript><div class="boot-shell"><div class="boot-card">NIRDHOOM requires JavaScript to run the operations console.</div></div></noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
